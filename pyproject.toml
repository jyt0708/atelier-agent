[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-agent"
version = "0.1.0"
description = "Chinese WeChat message drafting with a bounded LangGraph review loop"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openrouter>=0.2,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
proxy = ["httpx[socks]>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
